name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Ver archivos
        run: find . -not -path './.git/*' -maxdepth 3 | head -60
      - name: Compilar
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then echo "NO HAY settings.gradle.kts EN EL REPOSITORIO"; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MiAutoLauncher-apk
          path: "**/app-debug.apk"
